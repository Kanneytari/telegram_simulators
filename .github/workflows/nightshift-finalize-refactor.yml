name: NIGHTSHIFT finalize refactor

on:
  push:
    branches:
      - refactor/nightshift-clean-architecture
    paths:
      - ".github/workflows/nightshift-finalize-refactor.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/shadow_market_simulator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/nightshift-clean-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: shadow_market_simulator
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Verify refactor before cleanup
        shell: bash
        run: |
          cd shadow_market_simulator
          python -m pytest -q
          cd ..
          python tools/validate_nightshift_current.py
          python -m compileall -q shadow_market_simulator/app
          cd shadow_market_simulator
          ruff check app tests --select F401,F841
      - name: Remove temporary refactor infrastructure
        shell: bash
        run: |
          rm -f \
            .github/workflows/nightshift-analytics-trust-fix.yml \
            .github/workflows/nightshift-audit-current.yml \
            .github/workflows/nightshift-final-validation.yml \
            .github/workflows/nightshift-refactor-stage2.yml \
            .github/workflows/nightshift-refactor-stage3.yml \
            .github/workflows/nightshift-refactor-stage4.yml \
            .github/workflows/nightshift-refactor-stage5.yml \
            .github/workflows/nightshift-refactor-stage6.yml \
            .github/workflows/nightshift-refactor.yml \
            .github/workflows/nightshift-schema-stage7.yml \
            .github/workflows/nightshift-test-alignment.yml \
            .github/workflows/nightshift-unused-cleanup.yml \
            .github/workflows/nightshift-finalize-refactor.yml \
            NIGHTSHIFT_FINAL_VALIDATION.txt \
            NIGHTSHIFT_REFACTOR_AUDIT.txt \
            NIGHTSHIFT_STAGE6_APPLY.txt \
            NIGHTSHIFT_UNUSED_CLEANUP.txt \
            shadow_market_simulator/.ci-trigger \
            tools/align_nightshift_tests_current.py \
            tools/audit_nightshift_current.py \
            tools/cleanup_nightshift_unused.py \
            tools/fix_nightshift_analytics_trust.py \
            tools/fix_nightshift_schema_stage7.py \
            tools/refactor_nightshift.py \
            tools/refactor_nightshift_stage2.py \
            tools/refactor_nightshift_stage3.py \
            tools/refactor_nightshift_stage4.py \
            tools/refactor_nightshift_stage5.py \
            tools/refactor_nightshift_stage6.py \
            tools/validate_nightshift_current.py
      - name: Verify clean repository state
        shell: bash
        run: |
          cd shadow_market_simulator
          python -m pytest -q
          ruff check app tests --select F401,F841
          cd ..
          python -m compileall -q shadow_market_simulator/app
          if find tools .github/workflows -maxdepth 1 -type f \( -name '*nightshift*refactor*' -o -name '*nightshift*cleanup*' -o -name '*nightshift*validation*' -o -name '*nightshift*stage*' \) | grep -q .; then
            echo "Temporary refactor files remain"
            find tools .github/workflows -maxdepth 1 -type f | sort
            exit 1
          fi
      - name: Commit final repository cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize NIGHTSHIFT architecture cleanup [auto-finalize]"
          git push origin HEAD:refactor/nightshift-clean-architecture
