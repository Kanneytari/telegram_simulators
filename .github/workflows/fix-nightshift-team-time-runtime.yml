name: NIGHTSHIFT runtime ETA fix

on:
  push:
    branches:
      - fix/nightshift-team-time-runtime

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}/shadow_market_simulator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nightshift-team-time-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          cd shadow_market_simulator
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Fix final runtime status formatter
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('shadow_market_simulator/app/staff/insights.py')
          text = path.read_text(encoding='utf-8')

          old_import = 'from .simulation import parse_dt, utcnow\nfrom .workflow import WorkflowGameService, WorkflowSimulationEngine\n'
          new_import = 'from ..commerce.workflow import _format_game_duration\nfrom .simulation import parse_dt, utcnow\nfrom .workflow import WorkflowGameService, WorkflowSimulationEngine\n'
          assert old_import in text
          text = text.replace(old_import, new_import, 1)

          old_task = '                eta = "менее 1 ч" if remaining_game < 1 else f"~{remaining_game:.1f} ч"\n'
          new_task = '                eta = _format_game_duration(remaining_game)\n'
          assert old_task in text
          text = text.replace(old_task, new_task, 1)

          old_unavailable = '''                    eta = (\n                        "менее 1 ч" if remaining_game < 1 else f"~{remaining_game:.1f} ч"\n                    )\n'''
          new_unavailable = '                    eta = _format_game_duration(remaining_game)\n'
          assert old_unavailable in text
          text = text.replace(old_unavailable, new_unavailable, 1)

          old_details = '''            game_eta = (\n                "менее 1 ч" if remaining_game_h < 1 else f"~{remaining_game_h:.1f} ч"\n            )\n'''
          new_details = '            game_eta = _format_game_duration(remaining_game_h)\n'
          assert old_details in text
          text = text.replace(old_details, new_details, 1)

          path.write_text(text, encoding='utf-8')

          test_path = Path('shadow_market_simulator/tests/test_team_time_format.py')
          test = test_path.read_text(encoding='utf-8')
          addition = '''\n\ndef test_final_game_service_uses_precise_runtime_status_formatter() -> None:\n    import inspect\n\n    from app.staff.couriers.management import CourierManagementGameService\n    from app.staff.insights import StaffInsightGameService\n\n    assert CourierManagementGameService._task_status is StaffInsightGameService._task_status\n    source = inspect.getsource(CourierManagementGameService._task_status)\n    assert "_format_game_duration" in source\n    assert "remaining_game:.1f" not in source\n    assert "менее 1 ч" not in source\n'''
          if 'test_final_game_service_uses_precise_runtime_status_formatter' not in test:
              test_path.write_text(test.rstrip() + addition + '\n', encoding='utf-8')
          PY
      - name: Verify
        run: |
          cd shadow_market_simulator
          python -m compileall -q app tests
          python -m pytest -q
          ruff check app tests --select F401,F821,F841
      - name: Commit permanent changes
        run: |
          git config user.name "Kanneytari"
          git config user.email "hitroplan@yandex.ru"
          git add shadow_market_simulator/app/staff/insights.py shadow_market_simulator/tests/test_team_time_format.py
          git commit -m "fix(shadow-market): use precise ETA in final team status [skip ci]"
          git push origin HEAD:fix/nightshift-team-time-runtime
