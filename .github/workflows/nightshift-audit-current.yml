name: NIGHTSHIFT current runtime audit

on:
  push:
    branches:
      - refactor/nightshift-clean-architecture
    paths:
      - "tools/audit_nightshift_current.py"
      - ".github/workflows/nightshift-audit-current.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/shadow_market_simulator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/nightshift-clean-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: shadow_market_simulator
        run: python -m pip install -r requirements.txt
      - name: Write runtime audit
        run: python tools/audit_nightshift_current.py > NIGHTSHIFT_REFACTOR_AUDIT.txt
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NIGHTSHIFT_REFACTOR_AUDIT.txt
          git commit -m "Write temporary NIGHTSHIFT audit report [audit-report]"
          git push origin HEAD:refactor/nightshift-clean-architecture
