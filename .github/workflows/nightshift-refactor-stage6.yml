name: NIGHTSHIFT architectural cleanup stage 6

on:
  push:
    branches:
      - refactor/nightshift-clean-architecture
    paths:
      - "tools/refactor_nightshift_stage6.py"
      - ".github/workflows/nightshift-refactor-stage6.yml"

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[auto-stage6]') }}
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/shadow_market_simulator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/nightshift-clean-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: shadow_market_simulator
        run: python -m pip install -r requirements.txt
      - name: Apply cleanup and capture diagnostics
        id: cleanup
        shell: bash
        run: |
          set +e
          python tools/refactor_nightshift_stage6.py > /tmp/stage6.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
          fi
          cp /tmp/stage6.log NIGHTSHIFT_STAGE6_APPLY.txt
          echo "__EXIT_STATUS__=$status" >> NIGHTSHIFT_STAGE6_APPLY.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Commit cleanup or diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Apply NIGHTSHIFT stage 6 cleanup [auto-stage6]"
            git push origin HEAD:refactor/nightshift-clean-architecture
          fi
      - name: Fail on cleanup error
        if: steps.cleanup.outputs.status != '0'
        run: exit 1
      - name: Run complete tests
        if: steps.cleanup.outputs.status == '0'
        working-directory: shadow_market_simulator
        shell: bash
        run: |
          set +e
          python -m pytest -q 2>&1 | tee ../NIGHTSHIFT_STAGE6_TESTS.txt
          status=${PIPESTATUS[0]}
          echo "__EXIT_STATUS__=$status" >> ../NIGHTSHIFT_STAGE6_TESTS.txt
          exit $status
      - name: Compile application
        if: steps.cleanup.outputs.status == '0'
        run: python -m compileall -q shadow_market_simulator/app
