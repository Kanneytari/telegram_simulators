name: NIGHTSHIFT suppliers screen verification

on:
  push:
    branches:
      - ux/product-suppliers-screen-audit
    paths:
      - .github/workflows/audit-shadow-market-screen-ownership.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/shadow_market_simulator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/product-suppliers-screen-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: shadow_market_simulator
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Apply suppliers screen change
        run: |
          python .github/scripts/apply_product_suppliers_screen.py
          python .github/scripts/adjust_product_suppliers_tests.py
      - name: Verify
        working-directory: shadow_market_simulator
        run: |
          python -m compileall -q app tests
          python -m pytest -q
          ruff check app tests --select F401,F821,F841
      - name: Commit project changes
        run: |
          git config user.name "Kanneytari"
          git config user.email "hitroplan@yandex.ru"
          git add shadow_market_simulator/app/ui_commerce.py shadow_market_simulator/app/tutorial/hooks.py shadow_market_simulator/tests/test_compact_ui.py shadow_market_simulator/tests/test_architecture_guardrails.py shadow_market_simulator/tests/test_zz_gameplay_updates.py shadow_market_simulator/tests/test_zzzz_product_ui_final.py
          git commit -m "feat(shadow-market): nest procurement under suppliers"
          git push origin HEAD:ux/product-suppliers-screen-audit
