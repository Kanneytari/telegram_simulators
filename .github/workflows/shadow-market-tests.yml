name: NIGHTSHIFT tests

on:
  push:
    paths:
      - "shadow_market_simulator/**"
      - "tools/nightshift_current_cleanup.py"
      - ".github/workflows/shadow-market-tests.yml"
  pull_request:
    paths:
      - "shadow_market_simulator/**"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/shadow_market_simulator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/nightshift-clearer-game-flow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: shadow_market_simulator
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Apply current cleanup
        run: |
          python tools/nightshift_current_cleanup.py
          python - <<'PY'
          from pathlib import Path
          path = Path("shadow_market_simulator/app/ui_staff.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'await render_batch(target, game, player_id, batch_id, flash="Партия или сотрудник уже недоступны.")',
              'await render_batches(target, game, player_id, flash="Партия или сотрудник уже недоступны.")',
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Compile
        run: python -m compileall -q shadow_market_simulator/app
      - name: Run tests
        working-directory: shadow_market_simulator
        run: python -m pytest -q
      - name: Check unused code
        working-directory: shadow_market_simulator
        run: ruff check app tests --select F401,F821,F841
      - name: Fresh database and UI smoke
        working-directory: shadow_market_simulator
        run: |
          python - <<'PY'
          import asyncio
          import random
          import tempfile
          from pathlib import Path

          from app.courier_management import CourierManagementGameService, CourierManagementSimulationEngine
          from app.courier_recruitment import CourierRecruitmentService
          from app.db import Database
          from app.ui_commerce import render_product_root, render_storefront_root
          from app.ui_navigation import _home_snapshot
          from app.ui_staff import render_team

          class Target:
              def __init__(self):
                  self.text = None
                  self.reply_markup = None
              async def edit_text(self, text, **kwargs):
                  self.text = text
                  self.reply_markup = kwargs.get("reply_markup")
              async def answer(self, text, **kwargs):
                  self.text = text
                  self.reply_markup = kwargs.get("reply_markup")

          with tempfile.TemporaryDirectory() as tmp:
              db = Database(str(Path(tmp) / "fresh.db"))
              db.init()
              simulation = CourierManagementSimulationEngine(db, speed=1.0, rng=random.Random(1))
              simulation.ensure_player(1, "smoke")
              game = CourierManagementGameService(db, simulation, rng=random.Random(2))
              CourierRecruitmentService(db, speed=1.0, rng=random.Random(3))
              text, _, _ = _home_snapshot(db, game, simulation, 1)
              assert "NIGHTSHIFT" in text and "Баланс:" in text
              target = Target()
              asyncio.run(render_product_root(target, db, game, 1))
              assert "Товар" in target.text
              asyncio.run(render_storefront_root(target, db, game, simulation, 1))
              assert "Витрина" in target.text
              asyncio.run(render_team(target, game, simulation, 1))
              assert "Команда" in target.text
          PY
      - name: Reject stale UX and removed layers
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = [Path("shadow_market_simulator/app"), Path("shadow_market_simulator/tests")]
          text = "\n".join(p.read_text(encoding="utf-8") for root in roots for p in root.glob("*.py"))
          banned = [
              "menu:procurement",
              "menu:sales",
              "render_procurement_root",
              "render_sales_root",
              "DelayedDispute",
              "delayed_disputes",
              "prepare_positions",
              "готовит позиции",
              "Розничный сотрудник",
              "Оптовый сотрудник",
              "розничный сотрудник",
              "оптовый сотрудник",
              "car_required",
              "courier_reply_pending",
              "courier_reply_due_at",
          ]
          found = [value for value in banned if value in text]
          if found:
              raise SystemExit(f"stale NIGHTSHIFT contracts remain: {found}")
          if Path("shadow_market_simulator/app/delayed_disputes.py").exists():
              raise SystemExit("obsolete delayed_disputes.py still exists")
          PY
      - name: Commit validated cleanup
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shadow_market_simulator
          if ! git diff --cached --quiet; then
            git commit -m "Refine NIGHTSHIFT staff allocation and remove stale UX [cleanup-ci]"
            git pull --rebase origin ux/nightshift-clearer-game-flow
            git push origin HEAD:ux/nightshift-clearer-game-flow
          fi
