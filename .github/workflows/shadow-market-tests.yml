name: NIGHTSHIFT tests

on:
  push:
    paths:
      - "shadow_market_simulator/**"
      - ".github/workflows/shadow-market-tests.yml"
  pull_request:
    paths:
      - "shadow_market_simulator/**"
      - ".github/workflows/shadow-market-tests.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/shadow_market_simulator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/transfer-controls-db-init
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: shadow_market_simulator
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Apply requested changes
        run: |
          python tools/apply_transfer_controls_db_fix.py
          python tools/fix_compact_refresh_expectation.py
      - name: Compile
        run: python -m compileall -q shadow_market_simulator/app
      - name: Run tests
        working-directory: shadow_market_simulator
        run: python -m pytest -q
      - name: Check unused code
        working-directory: shadow_market_simulator
        run: ruff check app tests --select F401,F821,F841
      - name: Fresh database and UI smoke
        working-directory: shadow_market_simulator
        run: |
          python - <<'PY'
          import asyncio
          import random
          import tempfile
          from pathlib import Path

          from app.courier_management import CourierManagementGameService, CourierManagementSimulationEngine
          from app.courier_recruitment import CourierRecruitmentService
          from app.db import Database
          from app.ui_commerce import render_product_root, render_storefront_root
          from app.ui_navigation import _home_snapshot
          from app.ui_staff import render_team

          class Target:
              def __init__(self):
                  self.text = None
                  self.reply_markup = None
                  self.photo = None

              async def edit_text(self, text, **kwargs):
                  self.text = text
                  self.reply_markup = kwargs.get("reply_markup")

              async def answer(self, text, **kwargs):
                  self.text = text
                  self.reply_markup = kwargs.get("reply_markup")

              async def delete(self):
                  return None

              async def answer_photo(self, photo, caption=None, **kwargs):
                  self.text = caption
                  self.reply_markup = kwargs.get("reply_markup")

          with tempfile.TemporaryDirectory() as tmp:
              db = Database(str(Path(tmp) / "fresh.db"))
              db.init()
              db.init()
              simulation = CourierManagementSimulationEngine(db, speed=1.0, rng=random.Random(1))
              simulation.ensure_player(1, "smoke")
              game = CourierManagementGameService(db, simulation, rng=random.Random(2))
              CourierRecruitmentService(db, speed=1.0, rng=random.Random(3))

              home, _, _ = _home_snapshot(db, game, simulation, 1)
              assert "NIGHTSHIFT" in home and "Баланс:" in home

              target = Target()
              asyncio.run(render_product_root(target, db, game, 1))
              assert "Товар" in target.text
              asyncio.run(render_storefront_root(target, db, game, simulation, 1))
              assert "Витрина" in target.text
              asyncio.run(render_team(target, game, simulation, 1))
              assert "Команда" in target.text
          PY
      - name: Reject stale NIGHTSHIFT contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("shadow_market_simulator/app")
          tests = Path("shadow_market_simulator/tests")
          text = "\n".join(
              path.read_text(encoding="utf-8")
              for root in (app, tests)
              for path in root.glob("*.py")
          )
          banned = [
              "menu:procurement",
              "menu:sales",
              "render_procurement_root",
              "render_sales_root",
              "DelayedDispute",
              "delayed_disputes",
              "prepare_positions",
              "готовит позиции",
              "Розничный сотрудник",
              "Оптовый сотрудник",
              "розничный сотрудник",
              "оптовый сотрудник",
              "car_required",
              "courier_reply_pending",
              "courier_reply_due_at",
              "«Закупки»",
          ]
          found = [value for value in banned if value in text]
          if found:
              raise SystemExit(f"stale NIGHTSHIFT contracts remain: {found}")

          removed_files = [
              app / "delayed_disputes.py",
              app / "action_handlers.py",
              app / "procurement_handlers.py",
              app / "storefront_handlers.py",
              app / "workflow_handlers.py",
              app / "workflow_allocation_handlers.py",
              app / "workflow_dashboard_handlers.py",
              app / "workflow_reassign_handlers.py",
          ]
          leftovers = [str(path) for path in removed_files if path.exists()]
          if leftovers:
              raise SystemExit(f"obsolete NIGHTSHIFT modules returned: {leftovers}")

          batch_renderers = sum(
              path.read_text(encoding="utf-8").count("async def render_batch(")
              for path in (app / "ui_staff.py", app / "ui_staff_handlers.py")
          )
          if batch_renderers != 1:
              raise SystemExit(f"expected one canonical batch renderer, found {batch_renderers}")
          PY
      - name: Commit validated changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shadow_market_simulator
          if ! git diff --cached --quiet; then
            git commit -m "Refine transfer controls and make DB init idempotent"
            git pull --rebase origin ux/transfer-controls-db-init
            git push origin HEAD:ux/transfer-controls-db-init
          fi
