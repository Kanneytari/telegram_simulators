name: NIGHTSHIFT tests

on:
  push:
    paths:
      - "shadow_market_simulator/**"
      - "tools/nightshift_ux_*.py"
      - ".github/workflows/shadow-market-tests.yml"
  pull_request:
    paths:
      - "shadow_market_simulator/**"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/shadow_market_simulator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/nightshift-clearer-game-flow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: shadow_market_simulator
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Align tests and residual terminology
        run: |
          python tools/nightshift_ux_align_tests.py
          python tools/nightshift_ux_last_alignment.py
      - name: Compile
        run: python -m compileall -q shadow_market_simulator/app
      - name: Run tests
        working-directory: shadow_market_simulator
        run: python -m pytest -q
      - name: Check unused code
        working-directory: shadow_market_simulator
        run: ruff check app tests --select F401,F821,F841
      - name: Commit validated alignment
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shadow_market_simulator
          if ! git diff --cached --quiet; then
            git commit -m "Align NIGHTSHIFT tests with new UX [ux-tests]"
            git push origin HEAD:ux/nightshift-clearer-game-flow
          fi
