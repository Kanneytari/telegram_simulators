name: NIGHTSHIFT tests

on:
  push:
    paths:
      - "shadow_market_simulator/**"
      - ".github/workflows/shadow-market-tests.yml"
  pull_request:
    paths:
      - "shadow_market_simulator/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shadow_market_simulator
    env:
      PYTHONPATH: ${{ github.workspace }}/shadow_market_simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
