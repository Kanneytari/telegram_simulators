name: NIGHTSHIFT suppliers final verification

on:
  push:
    branches:
      - ux/product-suppliers-screen-audit
    paths:
      - .github/workflows/verify-product-suppliers-final.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/shadow_market_simulator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/product-suppliers-screen-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: shadow_market_simulator
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Restore tutorial decorators
        run: python .github/scripts/restore_product_root_tutorial_decorators.py
      - name: Verify
        working-directory: shadow_market_simulator
        run: |
          python -m compileall -q app tests
          python -m pytest -q
          ruff check app tests --select F401,F821,F841
      - name: Commit source fix
        run: |
          git config user.name "Kanneytari"
          git config user.email "hitroplan@yandex.ru"
          git add shadow_market_simulator/app/ui_commerce.py
          git commit -m "fix(shadow-market): preserve tutorial product root hooks"
          git push origin HEAD:ux/product-suppliers-screen-audit
