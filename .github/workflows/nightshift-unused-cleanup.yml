name: NIGHTSHIFT final dead-code cleanup

on:
  push:
    branches:
      - refactor/nightshift-clean-architecture
    paths:
      - "tools/cleanup_nightshift_unused.py"
      - ".github/workflows/nightshift-unused-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[auto-unused-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/nightshift-clean-architecture
          fetch-depth: 0
      - name: Apply cleanup with diagnostics
        id: cleanup
        shell: bash
        run: |
          set +e
          python tools/cleanup_nightshift_unused.py > /tmp/cleanup.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
          fi
          cp /tmp/cleanup.log NIGHTSHIFT_UNUSED_CLEANUP.txt
          echo "__EXIT_STATUS__=$status" >> NIGHTSHIFT_UNUSED_CLEANUP.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Commit cleanup or diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Apply NIGHTSHIFT dead-code cleanup [auto-unused-cleanup]"
            git push origin HEAD:refactor/nightshift-clean-architecture
          fi
      - name: Fail on cleanup error
        if: steps.cleanup.outputs.status != '0'
        run: exit 1
