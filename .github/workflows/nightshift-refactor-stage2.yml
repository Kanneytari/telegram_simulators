name: NIGHTSHIFT schema consolidation

on:
  push:
    branches:
      - refactor/nightshift-clean-architecture
    paths:
      - "tools/refactor_nightshift_stage2.py"
      - ".github/workflows/nightshift-refactor-stage2.yml"

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[auto-schema-refactor]') }}
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/shadow_market_simulator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/nightshift-clean-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: shadow_market_simulator
        run: python -m pip install -r requirements.txt
      - name: Apply refactor
        run: python tools/refactor_nightshift_stage2.py
      - name: Commit refactor
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate NIGHTSHIFT schema and catalog [auto-schema-refactor]"
          git push origin HEAD:refactor/nightshift-clean-architecture
      - name: Run tests
        working-directory: shadow_market_simulator
        run: python -m pytest -q
      - name: Compile application
        run: python -m compileall -q shadow_market_simulator/app
