name: NIGHTSHIFT analytics trust cleanup

on:
  push:
    branches:
      - refactor/nightshift-clean-architecture
    paths:
      - "tools/fix_nightshift_analytics_trust.py"
      - ".github/workflows/nightshift-analytics-trust-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[auto-analytics-trust]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/nightshift-clean-architecture
          fetch-depth: 0
      - name: Apply analytics trust cleanup
        run: python tools/fix_nightshift_analytics_trust.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shadow_market_simulator/app/analytics_log.py shadow_market_simulator/app/schema.sql
          if ! git diff --cached --quiet; then
            git commit -m "Use canonical trust in NIGHTSHIFT analytics [auto-analytics-trust]"
            git push origin HEAD:refactor/nightshift-clean-architecture
          fi
