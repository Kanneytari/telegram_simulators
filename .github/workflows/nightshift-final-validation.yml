name: NIGHTSHIFT final refactor validation

on:
  push:
    branches:
      - refactor/nightshift-clean-architecture
    paths:
      - "tools/validate_nightshift_current.py"
      - ".github/workflows/nightshift-final-validation.yml"

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[validation-report]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/shadow_market_simulator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/nightshift-clean-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: shadow_market_simulator
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Run final validation
        shell: bash
        run: |
          report="$GITHUB_WORKSPACE/NIGHTSHIFT_FINAL_VALIDATION.txt"
          : > "$report"
          set +e

          echo "=== PYTEST ===" | tee -a "$report"
          (cd shadow_market_simulator && python -m pytest -q) 2>&1 | tee -a "$report"
          pytest_status=${PIPESTATUS[0]}
          echo "PYTEST_EXIT=$pytest_status" | tee -a "$report"

          echo "" | tee -a "$report"
          echo "=== CURRENT ARCHITECTURE VALIDATOR ===" | tee -a "$report"
          python tools/validate_nightshift_current.py 2>&1 | tee -a "$report"
          validator_status=${PIPESTATUS[0]}
          echo "VALIDATOR_EXIT=$validator_status" | tee -a "$report"

          echo "" | tee -a "$report"
          echo "=== COMPILEALL ===" | tee -a "$report"
          python -m compileall -q shadow_market_simulator/app 2>&1 | tee -a "$report"
          compile_status=${PIPESTATUS[0]}
          echo "COMPILE_EXIT=$compile_status" | tee -a "$report"

          echo "" | tee -a "$report"
          echo "=== RUFF UNUSED ===" | tee -a "$report"
          (cd shadow_market_simulator && ruff check app tests --select F401,F841) 2>&1 | tee -a "$report"
          ruff_status=${PIPESTATUS[0]}
          echo "RUFF_EXIT=$ruff_status" | tee -a "$report"

          echo "" | tee -a "$report"
          echo "SUMMARY pytest=$pytest_status validator=$validator_status compile=$compile_status ruff=$ruff_status" | tee -a "$report"
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NIGHTSHIFT_FINAL_VALIDATION.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record NIGHTSHIFT final validation [validation-report]"
            git push origin HEAD:refactor/nightshift-clean-architecture
          fi

          if [ "$pytest_status" -ne 0 ] || [ "$validator_status" -ne 0 ] || [ "$compile_status" -ne 0 ] || [ "$ruff_status" -ne 0 ]; then
            exit 1
          fi

# rerun after canonical analytics trust cleanup
