name: NIGHTSHIFT UI vocabulary refactor

on:
  push:
    branches:
      - refactor/nightshift-ui-vocabulary

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}/shadow_market_simulator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/nightshift-ui-vocabulary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          cd shadow_market_simulator
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Apply presentation refactor
        run: python .github/scripts/refactor_nightshift_ui_vocabulary.py
      - name: Verify
        run: |
          cd shadow_market_simulator
          python -m compileall -q app tests
          python -m pytest -q
          ruff check app tests --select F401,F821,F841
      - name: Commit project changes
        run: |
          git config user.name "Kanneytari"
          git config user.email "hitroplan@yandex.ru"
          git add shadow_market_simulator/app shadow_market_simulator/tests shadow_market_simulator/docs/ARCHITECTURE.md
          git commit -m "refactor(shadow-market): centralize UI vocabulary"
          git push origin HEAD:refactor/nightshift-ui-vocabulary
