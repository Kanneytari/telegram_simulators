name: NIGHTSHIFT UX apply

on:
  push:
    branches:
      - ux/nightshift-clearer-game-flow
    paths:
      - ".github/workflows/nightshift-ux-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}/shadow_market_simulator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/nightshift-clearer-game-flow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: shadow_market_simulator
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Apply and validate UX package
        shell: bash
        run: |
          report="$GITHUB_WORKSPACE/NIGHTSHIFT_UX_REPORT.txt"
          tmp_report="$(mktemp)"
          set +e

          transform_status=0
          for script in \
            tools/nightshift_ux_backend.py \
            tools/nightshift_ux_navigation_commerce.py \
            tools/nightshift_ux_staff.py \
            tools/nightshift_ux_finish.py
          do
            echo "=== $script ===" | tee -a "$tmp_report"
            python "$script" 2>&1 | tee -a "$tmp_report"
            status=${PIPESTATUS[0]}
            echo "EXIT=$status" | tee -a "$tmp_report"
            if [ "$status" -ne 0 ]; then
              transform_status=$status
              break
            fi
          done

          if [ "$transform_status" -eq 0 ]; then
            echo "=== COMPILE ===" | tee -a "$tmp_report"
            python -m compileall -q shadow_market_simulator/app 2>&1 | tee -a "$tmp_report"
            compile_status=${PIPESTATUS[0]}
          else
            compile_status=99
          fi

          if [ "$transform_status" -eq 0 ] && [ "$compile_status" -eq 0 ]; then
            echo "=== PYTEST ===" | tee -a "$tmp_report"
            (cd shadow_market_simulator && python -m pytest -q) 2>&1 | tee -a "$tmp_report"
            pytest_status=${PIPESTATUS[0]}

            echo "=== RUFF ===" | tee -a "$tmp_report"
            (cd shadow_market_simulator && ruff check app tests --select F401,F821,F841) 2>&1 | tee -a "$tmp_report"
            ruff_status=${PIPESTATUS[0]}
          else
            pytest_status=99
            ruff_status=99
          fi

          echo "SUMMARY transform=$transform_status compile=$compile_status pytest=$pytest_status ruff=$ruff_status" | tee -a "$tmp_report"
          cp "$tmp_report" "$report"
          set -e

          if [ "$transform_status" -ne 0 ]; then
            git reset --hard HEAD
            git clean -fd shadow_market_simulator
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shadow_market_simulator NIGHTSHIFT_UX_REPORT.txt
          if ! git diff --cached --quiet; then
            git commit -m "Implement NIGHTSHIFT UX redesign [ux-apply]"
            git push origin HEAD:ux/nightshift-clearer-game-flow
          fi

          if [ "$transform_status" -ne 0 ] || [ "$compile_status" -ne 0 ] || [ "$pytest_status" -ne 0 ] || [ "$ruff_status" -ne 0 ]; then
            exit 1
          fi
