name: NIGHTSHIFT one-shot tutorial migration

on:
  push:
    branches:
      - refactor/shadow-market-tutorial-overlays
    paths:
      - .github/workflows/shadow-market-refactor-edit.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shadow-market-tutorial-overlays
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verification dependencies
        working-directory: shadow_market_simulator
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Migrate tutorial overlays into static package hooks
        run: python .github/scripts/migrate_shadow_market_tutorial.py

      - name: Verify migrated sources
        working-directory: shadow_market_simulator
        run: |
          python -m compileall -q app tests
          python -m pytest -q
          ruff check app tests --select F401,F821,F841

      - name: Commit tutorial migration
        run: |
          git config user.name "Kanneytari"
          git config user.email "hitroplan@yandex.ru"
          git add -A
          git commit -m "refactor(shadow-market): remove tutorial runtime overlays"
          git push origin HEAD:refactor/shadow-market-tutorial-overlays
