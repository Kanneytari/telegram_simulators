name: NIGHTSHIFT team time format

on:
  push:
    branches:
      - fix/nightshift-team-time-format

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}/shadow_market_simulator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nightshift-team-time-format
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          cd shadow_market_simulator
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Apply time formatting fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('shadow_market_simulator/app/commerce/workflow.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''TASK_LABELS = {
              "receive_batch": "получает партию",
              "handoff": "готовит мастер-клад",
              "place_stashes": "раскидывает клады",
          }
          '''
          replacement = anchor + '''\n\ndef _format_game_duration(hours: float) -> str:
              total_minutes = max(1, math.ceil(max(0.0, float(hours)) * 60.0))
              whole_hours, minutes = divmod(total_minutes, 60)
              if whole_hours and minutes:
                  return f"{whole_hours} ч {minutes} м"
              if whole_hours:
                  return f"{whole_hours} ч"
              return f"{minutes} м"
          '''
          assert anchor in text
          text = text.replace(anchor, replacement, 1)
          old = '''        remaining_game = remaining_real * self.simulation.effective_speed(player_id)
                  eta = "<1 ч" if remaining_game < 1 else f"~{remaining_game:.1f} ч"
                  return f"{TASK_LABELS.get(task['kind'], task['kind'])} · {eta}"'''
          new = '''        remaining_game = remaining_real * self.simulation.effective_speed(player_id)
                  eta = _format_game_duration(remaining_game)
                  return f"{TASK_LABELS.get(task['kind'], task['kind'])} · {eta}"'''
          assert old in text
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('shadow_market_simulator/tests/test_team_time_format.py')
          test.write_text('''from app.commerce.workflow import _format_game_duration\n\n\ndef test_team_task_time_uses_hours_and_minutes() -> None:\n    assert _format_game_duration(0.5) == "30 м"\n    assert _format_game_duration(1.2) == "1 ч 12 м"\n    assert _format_game_duration(2.0) == "2 ч"\n    assert _format_game_duration(2.01) == "2 ч 1 м"\n\n\ndef test_active_task_never_renders_zero_minutes() -> None:\n    assert _format_game_duration(0.0) == "1 м"\n''', encoding='utf-8')
          PY
      - name: Verify
        run: |
          cd shadow_market_simulator
          python -m compileall -q app tests
          python -m pytest -q
          ruff check app tests --select F401,F821,F841
      - name: Commit permanent changes
        run: |
          git config user.name "Kanneytari"
          git config user.email "hitroplan@yandex.ru"
          git add shadow_market_simulator/app/commerce/workflow.py shadow_market_simulator/tests/test_team_time_format.py
          git commit -m "fix(shadow-market): show precise team task time [skip ci]"
          git push origin HEAD:fix/nightshift-team-time-format
